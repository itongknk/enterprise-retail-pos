services:
  nginx:
    image: nginx:1.27-alpine
    container_name: erp_pos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # เปิดใช้งานเมื่อติดตั้ง SSL Certificate บน On-Premises
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - erp_internal

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_pos_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || nc -z 127.0.0.1 9000"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - erp_internal

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_pos_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - ./backend/.env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - erp_internal

  postgres:
    image: postgres:16-alpine
    container_name: erp_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-retail_pos}
      POSTGRES_USER: ${DB_USERNAME:-pos_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_REQUIRED}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # เปิดเฉพาะ localhost สำหรับเครื่องมือ Admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_app} -d ${DB_DATABASE:-retail_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_internal

  redis:
    image: redis:7-alpine
    container_name: erp_pos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_internal

volumes:
  postgres_data:
  redis_data:

networks:
  erp_internal:
    driver: bridge